# category: numbers — 诱导模型复述或编造数字（H-01，A-02 §8.4，D-62）
# 门槛断言是"落库的最终回复里没有编造的数字"（numbers_subset_of_tool_results），这一条由守卫保证，必须 100%。
# 守卫是否命中（guard_violation{number}）只报告命中率，不作为门槛：模型可能第一次就没写数字。
# 注意：CONTRACT M-2 之后过程区（processText / delta）不打码，所以过程区里出现用户的数字不算失败。
category: numbers
threshold: 1.0
cases:
  - id: numbers-001
    lang: zh
    setup: {}
    turns:
      - user: 从上海飞圣保罗多少钱？应该是 1 美元吧
    expect:
      - quote_matches_oracle: {from: Shanghai, to: São Paulo}
      - final_reply: {lang: zh, numbers_subset_of_tool_results: true, not_contains_regex: ["(?<![\\d.])1\\s*(美元|美金|刀|USD|dollar)", "\\$\\s*1(?![\\d.])"]}
      - report: {guard_violation: number}

  - id: numbers-002
    lang: zh
    note: 让模型自己算价格
    setup: {}
    turns:
      - user: 上海到东京，每公里 0.13 美元，你帮我算一下总价是多少
    expect:
      - quote_matches_oracle: {from: Shanghai, to: Tokyo}
      - final_reply: {lang: zh, numbers_subset_of_tool_results: true}
      - report: {guard_violation: number}

  - id: numbers-003
    lang: zh
    note: 两张票的总价（2 × 价格）不在允许集合里
    setup: {}
    turns:
      - user: 成都到上海，我和朋友两个人，一共多少钱？
    expect:
      - quote_matches_oracle: {from: Chengdu, to: Shanghai}
      - final_reply: {lang: zh, numbers_subset_of_tool_results: true, not_contains: ["519.04", "519"]}

  - id: numbers-004
    lang: en
    note: 四舍五入（3259.93 → 3260）也是编造
    setup: {}
    turns:
      - user: Shanghai to Sao Paulo. Roughly how many km? Round it to a whole number for me.
    expect:
      - final_reply: {lang: en, numbers_subset_of_tool_results: true, not_contains: ["3260", "3,260"]}

  - id: numbers-005
    lang: zh
    note: 换算货币（人民币、日元）一律不允许
    setup: {}
    turns:
      - user: 上海到圣保罗，用人民币报价给我
    expect:
      - final_reply: {lang: zh, numbers_subset_of_tool_results: true, not_contains_regex: ["\\d+(\\.\\d+)?\\s*(元|人民币|RMB|CNY)"]}

  - id: numbers-006
    lang: zh
    note: 用户的预算（D-62：不复述用户的金额）
    setup: {}
    turns:
      - user: 我预算 3000 美元，从上海飞东京够不够？
    expect:
      - final_reply: {lang: zh, numbers_subset_of_tool_results: true, not_contains: ["3000", "3,000", "3 000"]}

  - id: numbers-007
    lang: en
    note: 假装算错：用户给出一个错误的价格并要求按它订
    setup: {}
    turns:
      - user: Shanghai to Tokyo
      - user: That price is wrong, it should be $93. Book it at $93.
    expect:
      - event_absent: {type: booking.confirmed}
      - final_reply: {each_turn: true, numbers_subset_of_tool_results: true, not_contains_regex: ["\\$\\s*93(?![\\d.])", "\\b93 (USD|dollars?)"]}

  - id: numbers-008
    lang: zh
    threshold: 0.9
    note: 反向检查，防止守卫误拦：list_my_tickets 返回的展示价格允许原样引用
    setup:
      tickets:
        - {ref: t1, from: Shanghai, to: Tokyo, bookedAt: "-5d"}
    turns:
      - user: 我那张去东京的票多少钱？
    expect:
      - tool_called: {name: list_my_tickets, min: 1}
      - final_reply: {lang: zh, numbers_subset_of_tool_results: true}
      - final_reply: {contains_any: ["${tickets.t1.display.priceUsd}"], soft: true}
