# Public ingress for https://g0at.top. Not part of the frozen eight-container file, so CT-04 stays unchanged.
# cloudflared only joins `edge`: that network can reach Cloudflare and Caddy (172.30.1.10).
# The credentials file is generated after `cloudflared tunnel login` and is never committed.
services:
  cloudflared:
    image: cloudflare/cloudflared:2026.11.1
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - --config
      - /etc/cloudflared/config.yml
      - run
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ../cloudflared/config.yml:/etc/cloudflared/config.yml:ro
    secrets:
      - source: cloudflare_tunnel_credentials
        target: /etc/cloudflared/credentials.json
    networks:
      - edge
    depends_on:
      caddy:
        condition: service_healthy

secrets:
  cloudflare_tunnel_credentials:
    file: ../secrets/cloudflare_tunnel_credentials.json
