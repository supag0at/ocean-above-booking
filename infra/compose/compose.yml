# Ocean Above — runtime topology skeleton (T00). Owner of the final file: T14.
#
# FINAL (CT-04 / CT-05 test these; change only via the parent session):
#   - networks: subnets, internal flags, memberships and fixed addresses  (A-01 §2.2)
#   - secrets:  declarations and the secret × container matrix            (A-01 §2.3, D-28)
#   - no secret is ever passed as an environment variable; no ${...} interpolation of secrets
# Non-secret site settings are interpolated from --env-file infra/compose/site.env
# (SITE_ADDRESS, PUBLIC_ORIGIN, COOKIE_SECURE only). Defaults match that file so
# `docker compose config` without --env-file still resolves.
#
# Secret files live in infra/secrets/<name> (gitignored); only infra/secrets/<name>.example is committed.

name: ocean-above

x-node-service: &node-service
  # One shared image. Only gateway carries `build`; the other services reuse the tag.
  # Parallel builds of the same tag race inside compose bake ("image already exists").
  image: ocean-above-node:local
  user: '1000:1000'
  read_only: true
  working_dir: /app
  restart: unless-stopped
  tmpfs:
    - /tmp
    - /home/node
  environment: &node-env
    NODE_ENV: production

networks:
  edge: # NOT internal: Caddy obtains certificates
    ipam: { config: [{ subnet: 172.30.0.0/24 }] }
  front:
    internal: true
    ipam: { config: [{ subnet: 172.30.1.0/24 }] }
  app: # dynamic addresses (harness) only in .128/25; fixed addresses below .128
    internal: true
    ipam: { config: [{ subnet: 172.30.2.0/24, ip_range: 172.30.2.128/25 }] }
  bk:
    internal: true
    ipam: { config: [{ subnet: 172.30.3.0/24 }] }
  db_main:
    internal: true
    ipam: { config: [{ subnet: 172.30.4.0/24 }] }
  db_booking:
    internal: true
    ipam: { config: [{ subnet: 172.30.5.0/24 }] }
  egress: # NOT internal: harness → LLM provider (A-01 §2.7)
    ipam: { config: [{ subnet: 172.30.6.0/24 }] }

secrets:
  pg_superuser_password: { file: ../secrets/pg_superuser_password }
  pg_owner_password: { file: ../secrets/pg_owner_password }
  pg_gateway_password: { file: ../secrets/pg_gateway_password }
  pg_hands_password: { file: ../secrets/pg_hands_password }
  pg_booking_password: { file: ../secrets/pg_booking_password }
  redis_gateway_password: { file: ../secrets/redis_gateway_password }
  redis_harness_password: { file: ../secrets/redis_harness_password }
  deepseek_api_key: { file: ../secrets/deepseek_api_key }
  harness_service_token: { file: ../secrets/harness_service_token }
  booking_service_token: { file: ../secrets/booking_service_token }
  hands_token_signing_key: { file: ../secrets/hands_token_signing_key }
  cookie_secret: { file: ../secrets/cookie_secret }

configs:
  # Not a secret (A-01 §2.3): public half of hands_token_signing_key, mounted into gateway and hands.
  hands_token_public_key: { file: ../secrets/hands_token_public_key.pem }

services:
  caddy:
    build:
      context: ../..
      dockerfile: infra/caddy/Dockerfile
    image: ocean-above-caddy:local
    restart: unless-stopped
    ports: ['80:80', '443:443']
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      edge: {}
      front: { ipv4_address: 172.30.1.10 }
    # no secrets (A-01 §2.3)
    depends_on:
      harness:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  gateway:
    <<: *node-service
    build:
      context: ../..
      dockerfile: infra/compose/node.Dockerfile
    command: ['node', 'services/gateway/src/main.ts']
    networks:
      front: { ipv4_address: 172.30.1.20 }
      app: { ipv4_address: 172.30.2.20 }
      bk: { ipv4_address: 172.30.3.20 }
      db_main: { ipv4_address: 172.30.4.20 }
    environment:
      <<: *node-env
      PUBLIC_BIND: 172.30.1.20:8080
      PUBLIC_ALLOWED_PEERS: 172.30.1.10/32 # caddy only
      INTERNAL_BIND: 172.30.2.20:8081
      INTERNAL_ALLOWED_PEERS: 172.30.2.128/25 # harness dynamic range
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://127.0.0.1}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      PG_HOST: 172.30.4.10
      PG_PORT: '5432'
      PG_DATABASE: app
      PG_USER: fb_gateway
      REDIS_HOST: 172.30.2.40
      REDIS_PORT: '6379'
      REDIS_USER: gateway
      BOOKING_URL: http://172.30.3.30:8083
      AGENT_DELTA_MODE: stream
      LOG_LEVEL: info
    secrets:
      - pg_gateway_password
      - redis_gateway_password
      - harness_service_token # verifies
      - booking_service_token # holds
      - hands_token_signing_key
      - cookie_secret
    configs:
      - source: hands_token_public_key
        target: /run/configs/hands_token_public_key.pem
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      booking:
        condition: service_healthy
      hands:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '/app/infra/compose/ready.mjs', 'http://172.30.1.20:8080/readyz']
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 40s

  harness:
    <<: *node-service
    command: ['node', 'services/harness/src/main.ts']
    networks:
      app: {} # dynamic address, always inside 172.30.2.128/25
      egress: {}
    environment:
      <<: *node-env
      REDIS_HOST: 172.30.2.40
      REDIS_PORT: '6379'
      REDIS_USER: harness
      SESSION_API_URL: http://172.30.2.20:8081
      HANDS_URL: http://172.30.2.30:8082
      LOG_LEVEL: info
      # LLM_BASE_URL is intentionally unset (catalog DeepSeek address). Do not call the provider from this task.
    secrets:
      - redis_harness_password
      - deepseek_api_key
      - harness_service_token # holds
    depends_on:
      redis:
        condition: service_healthy
      gateway:
        condition: service_healthy
    healthcheck:
      # No HTTP port (do not add one). Healthy means the main process is still pid 1.
      test: ['CMD-SHELL', 'kill -0 1']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

  hands:
    <<: *node-service
    command: ['node', 'services/hands/src/run.ts']
    networks:
      app: { ipv4_address: 172.30.2.30 }
      db_main: { ipv4_address: 172.30.4.30 }
    environment:
      <<: *node-env
      HANDS_BIND: 172.30.2.30:8082
      HANDS_ALLOWED_PEERS: 172.30.2.128/25
      PG_HOST: 172.30.4.10
      PG_PORT: '5432'
      PG_DATABASE: app
      PG_USER: fb_hands
      LOCATIONS_DB_PATH: /data/locations.db
      LOG_LEVEL: info
      # HANDS_VERIFY_KEY_PATHS is not set. The code default is the mounted config path.
      # Putting it in the environment fails CT-04: the name matches /key/i and the path matches /token|key/i.
    secrets:
      - pg_hands_password
    configs:
      - source: hands_token_public_key
        target: /run/configs/hands_token_public_key.pem
    volumes:
      - type: bind
        source: ../../locations.db
        target: /data/locations.db # target path: placeholder (T08/T14); :ro and hands-only are final
        read_only: true
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'node', '/app/infra/compose/ready.mjs', 'http://172.30.2.30:8082/readyz']
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 40s

  booking:
    <<: *node-service
    command: ['node', 'services/booking/src/main.ts']
    networks:
      bk: { ipv4_address: 172.30.3.30 }
      db_booking: { ipv4_address: 172.30.5.30 }
    environment:
      <<: *node-env
      BOOKING_BIND: 172.30.3.30:8083
      BOOKING_ALLOWED_PEERS: 172.30.3.20/32
      PG_HOST: 172.30.5.10
      PG_PORT: '5432'
      PG_DATABASE: app
      PG_USER: fb_booking
      LOG_LEVEL: info
      # SECRETS_DIR is not set; the process default is /run/secrets.
    secrets:
      - pg_booking_password
      - booking_service_token # verifies
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'node', '/app/infra/compose/ready.mjs', 'http://172.30.3.30:8083/readyz']
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 40s

  postgres:
    image: postgres:16
    user: '999:999'
    restart: unless-stopped
    command: ['postgres', '-c', 'hba_file=/infra-db/pg_hba.conf']
    networks:
      db_main: { ipv4_address: 172.30.4.10 }
      db_booking: { ipv4_address: 172.30.5.10 }
    environment:
      POSTGRES_DB: app
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_superuser_password # a path, not a secret
      INFRA_DB_DIR: /infra-db # non-secret: where 00-roles.sh finds migrations/ and grants.sql (M-20)
    secrets:
      - pg_superuser_password
      - pg_owner_password # init only (00-roles.sh)
      - pg_gateway_password # init only
      - pg_hands_password # init only
      - pg_booking_password # init only
    volumes:
      - pg_data:/var/lib/postgresql/data
      - type: bind
        source: ../db
        target: /infra-db
        read_only: true
      - type: bind
        source: ../db/init
        target: /docker-entrypoint-initdb.d
        read_only: true
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d app']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  redis:
    image: redis:7
    user: '999:999'
    restart: unless-stopped
    entrypoint: ['/bin/sh', '/entrypoint.sh']
    networks:
      app: { ipv4_address: 172.30.2.40 }
    secrets:
      - redis_gateway_password
      - redis_harness_password
    volumes:
      - type: bind
        source: ../redis/entrypoint.sh
        target: /entrypoint.sh
        read_only: true
      - redis_data:/data
    tmpfs:
      - /tmp/acl:uid=999,gid=999,mode=0700
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'REDISCLI_AUTH=$$(tr -d ''\r\n'' < /run/secrets/redis_gateway_password) redis-cli --user gateway -h 127.0.0.1 --no-auth-warning ping | grep -q PONG',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  migrate:
    <<: *node-service
    command: ['bash', '/app/infra/db/migrate.sh']
    restart: 'no'
    networks:
      db_main: { ipv4_address: 172.30.4.40 }
    environment:
      <<: *node-env
      PG_HOST: 172.30.4.10
      PG_PORT: '5432'
      PG_DATABASE: app
      PG_USER: fb_owner
      INFRA_DB_DIR: /app/infra/db
      LOG_LEVEL: info
    secrets:
      - pg_owner_password
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pg_data: {}
  redis_data: {}
  caddy_data: {}
  caddy_config: {}
