# TCP rules are the five lines in A-01 §2.2. First match wins; the reject lines are last.
# Unix-socket lines are not in that list. 00-roles.sh (M-20) and the official entrypoint
# connect on the local socket: TCP to 127.0.0.1 is not an allowed source for any role,
# and during init the temporary server often has no TCP listener at all.
local   all         postgres                         trust
local   app         fb_owner                         trust
local   all         all                              reject
host    app         fb_gateway   172.30.4.20/32      scram-sha-256
host    app         fb_hands     172.30.4.30/32      scram-sha-256
host    app         fb_owner     172.30.4.40/32      scram-sha-256
host    app         fb_booking   172.30.5.30/32      scram-sha-256
host    all         all          0.0.0.0/0           reject
host    all         all          ::/0                reject
